name: Release
# Ao criar uma tag vX.Y.Z: publica as imagens multi-arquitetura no GitHub Packages (com SBOM e proveniência) e anexa
# os binários (linux amd64/arm64) e as somas de verificação à release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão e dono (minúsculas)
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-server:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-server:latest
      - name: Agente
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-agent:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-agent:latest
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Interface web (embutida no binário do Server)
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Compilar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            for bin in server agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/AprendendoLinux/corujabackup/internal/version.Version=${VERSION}" \
                -o "dist/coruja-${bin}-linux-${arch}" "./cmd/${bin}"
            done
          done
          cd dist && sha256sum coruja-* > SHA256SUMS
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
