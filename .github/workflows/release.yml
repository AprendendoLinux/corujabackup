name: Release
# Ao criar uma tag vX.Y.Z: publica as imagens multi-arquitetura no GitHub Packages (com SBOM e proveniência) e anexa
# os binários (linux amd64/arm64) e as somas de verificação à release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão e dono (minúsculas)
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          secrets: |
            google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-server:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-server:latest
      - name: Agente
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-agent:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/corujabackup-agent:latest
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Interface web (embutida no binário do Server)
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Compilar
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}  # aplicativo OAuth padrão do Google (opcional)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            for bin in server agent; do
              LDF="-s -w -X github.com/AprendendoLinux/corujabackup/internal/version.Version=${VERSION}"
              if [ "$bin" = server ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then LDF="$LDF -X github.com/AprendendoLinux/corujabackup/internal/cloud.DefaultGoogleClientSecret=${GOOGLE_CLIENT_SECRET}"; fi
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "$LDF" \
                -o "dist/coruja-${bin}-linux-${arch}" "./cmd/${bin}"
            done
          done
          cd dist && sha256sum coruja-* > SHA256SUMS
      - name: Anexar à release (cria a release se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Coruja Backup ${GITHUB_REF_NAME#v}" --notes "Veja o CHANGELOG.md do repositório."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
