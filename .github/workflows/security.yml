name: Segurança
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda-feira, 06:17 UTC
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install --no-audit --no-fund && npm audit --audit-level=high
