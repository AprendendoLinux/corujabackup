# Coruja Backup · Agente. Informe só o endereço do Server e o token gerado na interface web.
services:
  agent:
    image: ghcr.io/aprendendolinux/corujabackup-agent:0.0.2
    container_name: corujabackup-agent
    restart: always
    environment:
      CORUJA_SERVER: "IP_DO_SERVER:8443"
      CORUJA_TOKEN: "TOKEN_GERADO_NA_INTERFACE"
    volumes:
      - agent-data:/var/lib/coruja-agent   # guarda a credencial do agente (o token de matrícula só vale uma vez)
    # Opcional (desligado por padrão): permite ao agente entrar em contêineres de banco para fazer dumps.
    #   - /var/run/docker.sock:/var/run/docker.sock
    # Pastas do servidor a proteger (somente leitura), a partir da Fase 2:
    #   - /etc:/host/etc:ro
    networks: [echelon]
volumes:
  agent-data:

networks:
  echelon:
    external: true
