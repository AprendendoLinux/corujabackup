# Coruja Backup · Agente
# Cadastre o agente na interface (Agentes > Novo agente: nome, IP e porta). Ela gera o token (vale uma vez) e esta stack pronta.
# O Server conecta no agente pela porta publicada abaixo: libere-a só para o IP do Server.
services:
  agent:
    image: ghcr.io/aprendendolinux/corujabackup-agent:0.0.17
    container_name: corujabackup-agent
    restart: always
    ports:
      - "23847:23847"                        # o Server conecta aqui (a porta da esquerda é a cadastrada na interface)
    environment:
      CORUJA_TOKEN: "TOKEN_GERADO_NA_INTERFACE"
      CORUJA_HOST_ROOT: "/host"          # o servidor, como o agente o enxerga (veja o volume abaixo)
      # Defesa em profundidade (opcional, recomendado): o agente só executa o que estas listas permitirem,
      # mesmo que o Server (ou quem o controle) peça outra coisa. Vazio = sem restrição.
      # CORUJA_ALLOWED_PATHS: "/etc,/srv,/home"          # pastas que podem ser salvas
      # CORUJA_ALLOWED_CONTAINERS: "db-*,mongo"          # contêineres de banco em que o dump pode rodar
      # CORUJA_BACKUP_ROOTS: "/mnt,/srv/backups"         # onde o painel pode mandar gravar o backup local
    volumes:
      - agent-data:/var/lib/coruja-agent   # credencial do agente, agenda local e fila de resultados
      - /:/host:ro                         # tudo o que o agente pode salvar, SOMENTE LEITURA (restrinja às pastas necessárias, se preferir)
      # Grava o backup local na pasta escolhida no painel. Atenção: dá ao agente permissão de GRAVAÇÃO no servidor. Para
      # limitar onde ele pode gravar, use CORUJA_BACKUP_ROOTS; para não conceder a permissão, remova a linha (o backup
      # local fica então na pasta padrão abaixo).
      - /:/host-rw
      - /srv/coruja-backups:/backups       # pasta de backups padrão do agente (o agente a deixa fora da origem)
      # Destinos "pasta local" (NFS, iSCSI, disco externo): monte no host e exponha SOMENTE o que for destino em /destinos/...
      #   - /mnt/nas:/destinos/nas
      # Opcional (desligado por padrão): executar dumps DENTRO dos contêineres de banco e fazer o teste de restauração em
      # contêineres descartáveis. Dá ao agente controle total do Docker do servidor: habilite só se precisar.
      #   - /var/run/docker.sock:/var/run/docker.sock
    # Endurecimento: sem privilégios extras; só as duas capacidades necessárias para ler/gravar arquivos de outros donos
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    networks: [echelon]

volumes:
  agent-data:

networks:
  echelon:
    external: true
