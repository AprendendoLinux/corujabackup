syntax = "proto3";
package coruja.v1;
option go_package = "github.com/AprendendoLinux/corujabackup/internal/pb";

// Canal entre o Agente e o Server. Sempre iniciado pelo agente (funciona atrás de NAT/firewall).
service AgentService {
  // Matrícula: troca o token de matrícula (uso único, gerado na interface) por uma credencial própria do agente.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Canal permanente. Autenticado por metadata: "authorization: Bearer <agent_id>.<credential>".
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // Download para o navegador (0.0.24): o agente envia o conteúdo pedido (ação "download") num fluxo próprio, com o
  // controle de fluxo do HTTP/2 — um navegador lento segura só este download, não o canal principal.
  rpc Download(stream DownloadChunk) returns (DownloadDone);
  // Arquivo de backup que só está na nuvem (0.0.28): numa restauração, o agente pede ao Server, que o lê da conta de
  // nuvem (só ele tem as credenciais) e o entrega neste fluxo. Só arquivos de jobs do próprio agente.
  rpc FetchBackup(FetchRequest) returns (stream FetchChunk);
}

message FetchRequest {
  int64 job_id = 1;
  string file_name = 2;
  int64 offset = 3;                // início do trecho (0 = do começo)
  int64 length = 4;                // tamanho do trecho (0 = até o fim)
}
// FetchChunk: o primeiro traz o tamanho do que será entregue (o arquivo ou o trecho); os seguintes, só dados.
message FetchChunk {
  int64 size = 1;
  bytes data = 2;
}

// DownloadChunk: o primeiro traz o id do pedido e o nome do arquivo entregue; error encerra com falha.
message DownloadChunk {
  string id = 1;
  string file_name = 2;
  bytes data = 3;
  string error = 4;
}
message DownloadDone {}

message EnrollRequest {
  string token = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string agent_version = 5;
}

message EnrollResponse {
  int64 agent_id = 1;
  string credential = 2;      // mostrada UMA vez; o Server guarda só o hash
  string server_version = 3;
}

message AgentMessage {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    RunReport run_report = 3;
    UploadRequest upload_request = 4;
    UploadDone upload_done = 5;
    RpcResult rpc_result = 6;
    ActionLog action_log = 7;
  }
}

message Hello {
  string agent_version = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  bool docker_available = 5;
  repeated string active_runs = 6;   // execuções em andamento neste agente (o Server dá como falhas as demais)
}

message Heartbeat {
  int64 unix_ms = 1;
  int64 uptime_seconds = 2;
  double load1 = 3;
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Ack ack = 2;
    Revoked revoked = 3;
    SyncJobs sync_jobs = 4;
    RunNow run_now = 5;
    CancelRun cancel_run = 6;
    ReportAck report_ack = 7;
    UploadSession upload_session = 8;
    UploadVerdict upload_verdict = 9;
    Rpc rpc = 10;
    AgentAction action = 11;
  }
}

message Welcome { string server_version = 1; int32 heartbeat_seconds = 2; }
message Ack { int64 unix_ms = 1; }
message Revoked { string reason = 1; }

// ---- Fase 2: jobs de arquivos -------------------------------------------------------------------------------------

// JobSpec é a definição completa de um job. O Server envia o conjunto inteiro (snapshot) e o agente agenda sozinho:
// se o Server estiver fora no horário, o backup roda mesmo assim e o resultado fica na fila local até reconectar.
message JobSpec {
  int64 job_id = 1;
  string name = 2;
  string kind = 3;                 // "files" | "database" | "mikrotik"
  bool enabled = 4;
  string cron = 5;                 // 5 campos (minuto hora dia mês dia-da-semana)
  string timezone = 6;             // ex.: America/Sao_Paulo
  repeated string paths = 7;       // pastas/arquivos a salvar (caminhos do servidor)
  repeated string excludes = 8;    // padrões excluídos (* casa qualquer coisa, inclusive "/")
  string dest_subdir = 9;          // subpasta dentro da pasta de backups do agente (nunca caminho absoluto)
  int32 keep = 10;                 // quantas cópias manter no destino local (após verificar)
  int32 version = 11;              // muda a cada edição (o agente descarta agendas antigas)
  int64 cloud_account_id = 12;     // 0 = sem nuvem (só cópia local)
  string cloud_folder = 13;        // pasta na nuvem (informativo; quem decide é o Server)
  DbSpec db = 14;                  // kind="database"
  DestSpec dest = 15;              // destino "direto do agente" (SFTP, FTP, SMB, NFS, pasta local); ausente nas nuvens
  string backup_mode = 16;         // "full" (padrão) | "incremental": full no dia da semana abaixo, incrementais nos outros
  int32 full_weekday = 17;         // incremental: 0 = domingo ... 6 = sábado (no fuso do job)
  MikrotikSpec mikrotik = 18;      // kind="mikrotik"
}

// MikrotikSpec: roteador MikroTik acessado pelo agente via SSH (credenciais só pelo canal TLS; no agente, arquivo 600).
message MikrotikSpec {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string password = 4;
  string private_key = 5;
  string host_key = 6;             // impressão digital SHA256 fixada
  bool export = 7;                 // .rsc sem dados sensíveis
  bool export_sensitive = 8;       // .rsc com senhas e chaves
  bool binary = 9;                 // .backup cifrado
  string backup_password = 10;
}

// DestSpec: o agente envia, confere e aplica a retenção. A configuração (com credenciais) viaja só pelo canal TLS e fica no
// disco do agente com permissão 600.
message DestSpec {
  string type = 1;                 // "sftp" | "ftp" | "smb" | "nfs" | "local"
  bytes config = 2;                // netdest.Config em JSON
  string folder = 3;
  int32 keep = 4;
  int32 keep_days = 5;
  bool direct = 6;                 // grava o .tar.gz direto no storage, sem arquivo local (agente 0.0.19+)
}

message SyncJobs { repeated JobSpec jobs = 1; }

message RunNow { int64 job_id = 1; string run_uid = 2; bool force_full = 3; }
message CancelRun { string run_uid = 1; }
message ReportAck { string run_uid = 1; }

message LogLine { int32 seq = 1; int64 unix_ms = 2; string level = 3; string text = 4; }

// RunReport é idempotente: o Server faz "upsert" por run_uid. FINISHED carrega o log completo e entra na fila local
// do agente até receber ReportAck.
message RunReport {
  enum State { STARTED = 0; PROGRESS = 1; FINISHED = 2; }
  string run_uid = 1;
  int64 job_id = 2;
  State state = 3;
  string trigger = 4;              // "schedule" | "manual"
  int64 scheduled_for_ms = 5;      // horário previsto (agendados); 0 nos manuais
  int64 started_ms = 6;
  int64 finished_ms = 7;
  string status = 8;               // FINISHED: "ok" | "warning" | "failed" | "canceled"
  int64 bytes_source = 9;
  int64 bytes_output = 10;
  int64 files = 11;
  string sha256 = 12;
  string output_name = 13;
  string error = 14;
  repeated LogLine logs = 15;
  int32 job_version = 16;
  string phase = 17;               // archiving | uploading | verifying
  int32 progress_pct = 18;
  string cloud_status = 19;        // none | ok | failed
  string cloud_path = 20;
  string cloud_hash = 21;
  string cloud_verified_by = 22;
  string backup_kind = 23;         // "full" | "incremental"
}

// ---- Fase 3: envio para a nuvem ------------------------------------------------------------------------------------
// O arquivo vai DIRETO do agente para a nuvem. O Server (único a guardar as credenciais) só emite a sessão de upload e,
// depois, confere o resultado e aplica a retenção na nuvem.

message UploadRequest {
  string request_id = 1;
  string run_uid = 2;
  int64 job_id = 3;
  string file_name = 4;
  int64 size = 5;
}

message UploadSession {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  string protocol = 4;             // "graph" (OneDrive) | "gdrive" (Google Drive) | "dropbox"
  string url = 5;                  // URL da sessão (já autenticada; o agente não recebe tokens)
  int64 chunk_size = 6;
  int64 expires_unix_ms = 7;
  string remote_path = 8;
  string token = 9;                // só "dropbox": token de curta duração, só de escrita de conteúdo, na pasta do aplicativo
  string upload_path = 10;         // só "dropbox": caminho de destino
}

message UploadDone {
  string request_id = 1;
  string run_uid = 2;
  int64 job_id = 3;
  string file_name = 4;
  int64 size = 5;
  string md5 = 6;
  string sha1 = 7;
  string quickxor = 8;
  string sha256 = 9;
  string remote_id = 10;
  bool ok = 11;
  string error = 12;
  string dropbox_hash = 13;        // content_hash do Dropbox
}

message UploadVerdict {
  string request_id = 1;
  bool ok = 2;
  string message = 3;
  string verified_by = 4;          // quickxor | sha1 | md5 | size
  string remote_path = 5;
  string remote_hash = 6;
  repeated string retention_log = 7;
}

// ---- Fase 4: bancos de dados ---------------------------------------------------------------------------------------

// DbSpec descreve um job de banco (kind="database"). Contém credenciais: viaja só pelo canal TLS e fica no disco do agente
// com permissão 600.
message DbSpec {
  string engine = 1;               // mysql | mariadb | postgres | mongodb
  string mode = 2;                 // docker (exec no contêiner) | network (clientes do agente)
  string container = 3;
  string host = 4;
  int32 port = 5;
  string user = 6;
  string password = 7;
  string auth_db = 8;
  repeated string databases = 9;   // vazio = todos
  repeated string exclude_databases = 10;
  bool ssl_skip_verify = 11;
  string restore_test = 12;        // none | structural | full
  string restore_image = 13;
}

// Chamada genérica Server -> agente com resposta (listar contêineres, testar conexão de banco...).
message Rpc { string id = 1; string kind = 2; bytes payload = 3; }
message RpcResult { string id = 1; bool ok = 2; string error = 3; bytes payload = 4; }

// ---- Fase 5: ações sobre backups já feitos (reenviar para a nuvem, extrair numa pasta) ----------------------------------

message AgentAction {
  string id = 1;
  string kind = 2;                 // "reupload" | "extract" | "fetch" | "restore_files" | "index" | "download" | "restore_db"
  string run_uid = 3;
  int64 job_id = 4;
  string file_name = 5;            // arquivo de backup (no padrão do job) na pasta de destino do agente
  string subdir = 6;
  string target = 7;               // extract: nome da pasta em <backups>/restores/
  string sha256 = 8;               // fetch/extract: hash esperado do arquivo (o que vier do storage é conferido)
  repeated string chain = 9;       // extract de um incremental: arquivos da cadeia em ordem (o full primeiro; o último é file_name)
  repeated string chain_sha256 = 10; // SHA-256 de cada arquivo de chain (para conferir o que for trazido do storage)
  repeated string paths = 11;      // restore_files: caminhos escolhidos (pastas incluem o que há dentro)
  bool original = 12;              // restore_files: grava no local original (sobrescreve), em vez de restores/<target>
  string download_id = 13;         // download: id do pedido (vai no primeiro DownloadChunk)
  bool zip = 14;                   // download: entrega um .zip (senão, o arquivo escolhido como está)
  repeated string targets = 15;    // restore_db: nome de destino de cada banco de paths (mesma ordem); original = sobrescrever
  string dest_dir = 16;            // restore_files: pasta absoluta do servidor que recebe os itens (a partir da pasta-mãe comum deles)
}

message ActionLog {
  string run_uid = 1;
  string kind = 2;
  string state = 3;                // running | ok | failed
  string message = 4;
  repeated LogLine logs = 5;       // sem seq: o Server numera a partir de 10000
  string cloud_status = 6;
  string cloud_path = 7;
  string cloud_hash = 8;
  string cloud_verified_by = 9;
  string path = 10;                // extract: onde ficou (caminho dentro do agente)
}
