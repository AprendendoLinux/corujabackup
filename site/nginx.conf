server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location = / { try_files /index.html =404; }
  location / { try_files $uri $uri.html =404; }
  # retorno do login por popup: sem registro de acesso (a URL traz o código de uso único), sem cache e sem Referer
  location ~ ^/oauth/(google|microsoft|dropbox)/callback$ {
    access_log off;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    try_files /oauth-callback.html =404;
  }
  location = /oauth-callback.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
